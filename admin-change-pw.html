<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 비밀번호 변경</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="card" style="max-width:420px;margin:20px auto;">
        <h2>관리자 비밀번호 변경</h2>
        <label>현재 비밀번호</label>
        <input type="password" id="oldPw">
        <label>새 비밀번호</label>
        <input type="password" id="newPw">
        <button class="save-btn" onclick="changeAdminPassword()">비밀번호 변경</button>
        <button class="secondary-btn" style="margin-top:8px;" onclick="location.href='admin.html'">관리자 페이지로</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
