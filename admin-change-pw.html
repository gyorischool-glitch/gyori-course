<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>관리자 비밀번호 변경</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top-bar">
  <h1>비밀번호 변경</h1>
  <nav>
    <a class="btn small outline" href="admin.html">관리자 페이지</a>
    <button class="btn small" onclick="logoutAdmin()">로그아웃</button>
  </nav>
</header>

<main class="page-center">
<section class="card card-narrow">
  <label>현재 비밀번호</label>

  <label>새 비밀번호</label>
  <input type="password" id="newPw">

  <label>새 비밀번호 확인</label>
  <input type="password" id="newPw2">

  <button class="btn primary full" onclick="changePw()">비밀번호 변경</button>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

</html>
