<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>관리자 페이지</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="module">
import { auth, db } from './firebase-config.js';
import { signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { ref, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const coursesRef = ref(db, 'courses');
let editingId = null;

window.onload = () => {
  logoutBtn.onclick = () => signOut(auth).then(()=>location.href='admin-login.html');

  saveCourseBtn.onclick = async () => {
    const data = {
      name: name.value,
      category: category.value,
      day: day.value,
      time: time.value,
      minGrade: Number(minGrade.value),
      maxGrade: Number(maxGrade.value),
      teacher: teacher.value,
      capacity: Number(capacity.value)
    };

    if (editingId) {
      const snap = await get(ref(db, 'appliesByCourse/' + editingId));
      if (snap.exists() && (day.value !== snap.val().day || time.value !== snap.val().time)) {
        if (!confirm('요일/시간이 변경됩니다. 기존 신청자에게 영향을 줄 수 있습니다. 계속할까요?')) return;
      }
      await update(ref(db, 'courses/' + editingId), data);
      editingId = null;
    } else {
      await push(coursesRef, data);
    }
    courseForm.reset();
  };

  onValue(coursesRef, snap => {
    courseTable.innerHTML = '';
    Object.entries(snap.val() || {}).forEach(([id, c]) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.name}</td>
        <td>${c.category}</td>
        <td>${c.day}</td>
        <td>${c.time}</td>
        <td>${c.teacher}</td>
        <td>${c.capacity}</td>
        <td id="count-${id}">0 / ${c.capacity}</td>
        <td>
          <button onclick="editCourse('${id}')">수정</button>
          <button onclick="deleteCourse('${id}')">삭제</button>
        </td>`;
      courseTable.appendChild(tr);

      onValue(ref(db, 'appliesByCourse/' + id), s => {
        const count = s.exists() ? Object.keys(s.val()).length : 0;
        document.getElementById('count-' + id).textContent = `${count} / ${c.capacity}`;
      });
    });
  });
};

window.editCourse = (id) => {
  editingId = id;
  onValue(ref(db, 'courses/' + id), snap => {
    const c = snap.val();
    name.value = c.name;
    category.value = c.category;
    day.value = c.day;
    time.value = c.time;
    minGrade.value = c.minGrade;
    maxGrade.value = c.maxGrade;
    teacher.value = c.teacher;
    capacity.value = c.capacity;
  }, { onlyOnce: true });
};

window.deleteCourse = async (id) => {
  if (!confirm('이 과목을 삭제하면 신청 데이터도 함께 삭제됩니다. 진행할까요?')) return;
  await remove(ref(db, 'courses/' + id));
  await remove(ref(db, 'appliesByCourse/' + id));
};
</script>
</head>
<body>
<h2>관리자 페이지</h2>
<button id="logoutBtn">로그아웃</button>

<h3>과목 등록 / 수정</h3>
<form id="courseForm">
<input id="name" placeholder="과목명">
<input id="category" placeholder="구분">
<input id="day" placeholder="요일">
<input id="time" placeholder="시간">
<input id="minGrade" placeholder="최소학년">
<input id="maxGrade" placeholder="최대학년">
<input id="teacher" placeholder="강사">
<input id="capacity" placeholder="정원">
<button type="button" id="saveCourseBtn">저장</button>
</form>

<h3>과목 목록</h3>
<table>
<thead>
<tr>
<th>과목명</th><th>구분</th><th>요일</th><th>시간</th>
<th>강사</th><th>정원</th><th>신청인원</th><th>관리</th>
</tr>
</thead>
<tbody id="courseTable"></tbody>
</table>
</body>
</html>
