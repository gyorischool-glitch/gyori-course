<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 페이지 - 교리초 수강신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="top-bar">
    <h1>관리자 페이지</h1>
    <nav>
      <span id="adminUserLabel"></span>
      <button class="btn small outline" onclick="goStudent()">학생 화면</button>
      <button class="btn small" onclick="logoutAdmin()">로그아웃</button>
    </nav>
  </header>

  <main class="content">
    <section class="card">
      <h2>📅 수강신청 기간 설정</h2>
      <div class="grid-2">
        <div>
          <label>시작 날짜/시간</label>
          <input type="datetime-local" id="applyStart" />
        </div>
        <div>
          <label>마감 날짜/시간</label>
          <input type="datetime-local" id="applyEnd" />
        </div>
      </div>
      <button class="btn primary" onclick="saveApplyPeriod()">기간 저장</button>
      <p id="applyPeriodMsg" class="hint"></p>
    </section>

    <section class="card">
      <h2>📘 강좌 등록/수정</h2>
      <input type="hidden" id="courseId" />
      <div class="grid-2">
        <div>
          <label>강좌명</label>
          <input type="text" id="courseName" />
        </div>
        <div>
          <label>대상 학년 (예: 3-4)</label>
          <input type="text" id="courseGradeRange" placeholder="예: 3-4 (전체: 1-6)" />
        </div>
      </div>
      <div class="grid-3">
        <div>
          <label>요일</label>
          <input type="text" id="courseDay" placeholder="월, 화, 수..." />
        </div>
        <div>
          <label>시작 시간</label>
          <input type="time" id="courseStartTime" />
        </div>
        <div>
          <label>종료 시간</label>
          <input type="time" id="courseEndTime" />
        </div>
      </div>
      <div class="grid-3">
        <div>
          <label>정원</label>
          <input type="number" id="courseLimit" min="1" />
        </div>
        <div>
          <label>수업 시간(시간)</label>
          <input type="number" id="courseHours" min="1" />
        </div>
        <div>
          <label>수업 기간 (예: 2025-03-02~2025-06-30)</label>
          <input type="text" id="coursePeriod" />
        </div>
      </div>
      <button class="btn primary" onclick="saveCourse()">강좌 저장</button>
      <button class="btn outline" onclick="clearCourseForm()">새로 입력</button>
    </section>

    <section class="card">
      <h2>📋 강좌 목록</h2>
      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>강좌명</th>
              <th>학년</th>
              <th>요일</th>
              <th>시간</th>
              <th>정원</th>
              <th>신청/대기</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="courseListBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>👨‍👩‍👧‍👦 신청자 / 대기자</h2>
      <p id="selectedCourseTitle" class="highlight"></p>
      <div class="grid-2">
        <div>
          <h3>신청자 목록</h3>
          <ul id="appliedList" class="list"></ul>
        </div>
        <div>
          <h3>대기자 목록</h3>
          <ul id="waitList" class="list"></ul>
        </div>
      </div>
      <button class="btn outline" onclick="downloadCourseCsv()">엑셀(CSV) 다운로드</button>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
