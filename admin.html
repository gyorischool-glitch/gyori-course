<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지 - 교리초 수강신청</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="top-menu">
        <button onclick="goStudent()">학생 화면</button>
        <button onclick="goChangePw()">관리자 비밀번호 변경</button>
        <button onclick="adminLogout()">로그아웃</button>
    </div>

    <div class="card" style="margin-top:10px;">
        <h3>📅 수강신청 기간 설정</h3>
        <label>시작 날짜/시간</label>
        <input type="datetime-local" id="applyStart">
        <label>마감 날짜/시간</label>
        <input type="datetime-local" id="applyEnd">
        <button class="save-btn" onclick="saveApplyPeriod()">기간 저장</button>
        <p id="applyPeriodMsg" style="margin-top:8px;"></p>
    </div>

    <div class="card">
        <h3>📘 강좌 등록/수정</h3>
        <input type="hidden" id="courseId">
        <label>강좌명</label>
        <input type="text" id="courseName">
        <label>요일 (예: 월,화,수)</label>
        <input type="text" id="courseDay">
        <label>시작 시간 (예: 13:00)</label>
        <input type="time" id="courseStartTime">
        <label>종료 시간 (예: 14:00)</label>
        <input type="time" id="courseEndTime">
        <label>정원</label>
        <input type="number" id="courseLimit">
        <label>수업 시간(시간 단위)</label>
        <input type="number" id="courseHours" placeholder="예: 1,2">

        <button class="save-btn" onclick="saveCourse()">강좌 저장</button>
    </div>

    <div class="card">
        <h3>📋 강좌 목록</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>강좌명</th>
                        <th>요일</th>
                        <th>시간</th>
                        <th>정원</th>
                        <th>신청/대기</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="courseListBody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
