<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>수강신청 - 교리초</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin:0; padding:0; background:#f5f7fb; }
    .wrap { max-width:720px; margin:20px auto; background:#fff; border-radius:12px; padding:20px; box-shadow:0 8px 20px rgba(0,0,0,.06); }
    h2 { margin-top:0; font-size:20px; }
    .student { font-size:14px; margin-bottom:12px; color:#374151; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
    th, td { border-bottom:1px solid #e5e7eb; padding:8px 6px; text-align:left; }
    th { background:#f3f4f6; }
    button { padding:6px 10px; border-radius:6px; border:none; cursor:pointer; font-size:13px; }
    .apply { background:#2563eb; color:#fff; }
    .cancel { background:#ef4444; color:#fff; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:14px; }
    a { color:#2563eb; text-decoration:none; }
    .msg { margin-top:8px; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div><strong>교리초 수강신청</strong></div>
      <div><a href="index.html">← 메인으로</a></div>
    </div>
    <h2>수강신청</h2>
    <div class="student" id="studentInfo"></div>
    <div class="msg" id="msg"></div>

    <table id="courseTable">
      <thead>
        <tr>
          <th>과목</th>
          <th>대상 학년</th>
          <th>시간</th>
          <th>정원</th>
          <th>상태</th>
          <th>신청</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script type="module">
import { app, db } from './firebase-config.js';
import {
  ref,
  onValue,
  runTransaction,
  set,
  remove,
  get
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const studentInfoEl = document.getElementById('studentInfo');
const msgEl = document.getElementById('msg');
const tbody = document.querySelector('#courseTable tbody');

let student = null;

// ------------------------ 시간 파싱 기능 ------------------------

// "월 3~4교시" → { day: "월", start: 3, end: 4 }
function parseTimeStr(str) {
  if (!str) return null;
  const match = str.match(/([월화수목금토일])\s*(\d+)\s*~\s*(\d+)교시/);

  if (!match) return null;

  return {
    day: match[1],
    start: parseInt(match[2], 10),
    end: parseInt(match[3], 10)
  };
}

// 두 시간대가 겹치는지
function isTimeConflict(t1, t2) {
  if (!t1 || !t2) return false;
  if (t1.day !== t2.day) return false;

  return !(t1.end < t2.start || t2.end < t1.start);
}

// 학생이 이미 신청한 과목들의 시간대 리스트
function getMyAppliedTimeList(courses, studentApplied) {
  const list = [];

  if (!courses || !studentApplied) return list;

  Object.entries(studentApplied).forEach(([courseId, v]) => {
    if (v && courses[courseId]) {
      const t = parseTimeStr(courses[courseId].time);
      if (t) list.push(t);
    }
  });

  return list;
}

// ---------------------------------------------------------------

// 학생 정보 로드
function loadStudent() {
  const raw = localStorage.getItem('gyori_student');
  if (!raw) {
    studentInfoEl.textContent = '학생 정보가 없습니다. 처음 화면으로 돌아가 다시 입력해 주세요.';
    msgEl.textContent = '';
    return;
  }
  student = JSON.parse(raw);
  studentInfoEl.textContent = `학년: ${student.grade} / 반: ${student.class} / 이름: ${student.name}`;
}

let allCoursesCache = {};
let myAppliedCache = {};
let myWaitingCache = {};

// 과목 렌더링
function renderCourses(courses, studentApplied, studentWaiting) {
  tbody.innerHTML = '';
  const gradeNum = parseInt(student.grade, 10);

  Object.entries(courses || {}).forEach(([id, c]) => {
    const minG = parseInt(c.minGrade, 10);
    const maxG = parseInt(c.maxGrade, 10);
    if (!isNaN(minG) && !isNaN(maxG) && (gradeNum < minG || gradeNum > maxG)) return;

    const tr = document.createElement('tr');
    const appliedCount = c.appliedCount || 0;
    const capacity = c.capacity || 0;
    const isFull = capacity > 0 && appliedCount >= capacity;
    const isApplied = studentApplied && studentApplied[id];
    const isWaiting = studentWaiting && studentWaiting[id];

    tr.innerHTML = `
      <td>${c.name || ''}</td>
      <td>${c.minGrade || ''}~${c.maxGrade || ''}</td>
      <td>${c.time || ''}</td>
      <td>${appliedCount}/${capacity || '-'}</td>
      <td>${isApplied ? '신청완료' : isWaiting ? '대기중' : (isFull ? '마감' : '신청가능')}</td>
      <td></td>
    `;

    const btnCell = tr.lastElementChild;
    const btn = document.createElement('button');

    if (isApplied) {
      btn.textContent = '신청취소';
      btn.className = 'cancel';
      btn.onclick = () => cancelCourse(id);
    }
    else if (isWaiting) {
      btn.textContent = '대기취소';
      btn.className = 'cancel';
      btn.onclick = () => cancelWaiting(id);
    }
    else if (isFull) {
      btn.textContent = '대기신청';
      btn.className = 'apply';
      btn.onclick = () => applyWaiting(id);
    }
    else {
      btn.textContent = '신청';
      btn.className = 'apply';
      btn.onclick = () => applyCourse(id);
    }

    btnCell.appendChild(btn);
    tbody.appendChild(tr);
  });
}

// DB 감시
function watchCourses() {
  if (!student) return;

  const coursesRef = ref(db, 'courses');
  const appliedRef = ref(db, 'appliedByStudent/' + encodeURIComponent(student.name));
  const waitingRef = ref(db, 'courseWaitingByStudent/' + encodeURIComponent(student.name));

  onValue(coursesRef, (snapCourses) => {
    allCoursesCache = snapCourses.val() || {};

    onValue(appliedRef, (snapApplied) => {
      myAppliedCache = snapApplied.val() || {};

      onValue(waitingRef, (snapWaiting) => {
        myWaitingCache = snapWaiting.val() || {};

        renderCourses(allCoursesCache, myAppliedCache, myWaitingCache);
      });
    });
  });
}

//
// -------------------- 신청 기능 --------------------
//

// 정상 신청
function applyCourse(courseId) {
  if (!student) return;

  msgEl.textContent = '';

  // ---------------- 시간 중복 체크 ----------------
  const myTimeList = getMyAppliedTimeList(allCoursesCache, myAppliedCache);
  const newTime = parseTimeStr(allCoursesCache[courseId].time);

  for (const t of myTimeList) {
    if (isTimeConflict(t, newTime)) {
      msgEl.textContent = '이미 같은 시간대의 과목을 신청했습니다.';
      return;
    }
  }
  // ------------------------------------------------

  const courseRef = ref(db, 'courses/' + courseId);
  const appliedListRef =
    ref(db, 'courseApplied/' + courseId + '/' + encodeURIComponent(student.name));
  const appliedByStudentRef =
    ref(db, 'appliedByStudent/' + encodeURIComponent(student.name) + '/' + courseId);

  runTransaction(courseRef, (course) => {
    if (course) {
      const capacity = course.capacity || 0;
      const appliedCount = course.appliedCount || 0;
      if (capacity && appliedCount >= capacity) {
        return;
      }
      course.appliedCount = appliedCount + 1;
    }
    return course;
  })
    .then((result) => {
      if (!result.committed) {
        msgEl.textContent = '정원이 가득 찼습니다.';
        return;
      }

      set(appliedListRef, {
        grade: student.grade,
        class: student.class,
        name: student.name
      });
      set(appliedByStudentRef, true);

      msgEl.textContent = '신청이 완료되었습니다.';
    })
    .catch(() => {
      msgEl.textContent = '신청 중 오류가 발생했습니다.';
    });
}

// 신청 취소
function cancelCourse(courseId) {
  msgEl.textContent = '';

  const courseRef = ref(db, 'courses/' + courseId);
  const appliedListRef =
    ref(db, 'courseApplied/' + courseId + '/' + encodeURIComponent(student.name));
  const appliedByStudentRef =
    ref(db, 'appliedByStudent/' + encodeURIComponent(student.name) + '/' + courseId);

  runTransaction(courseRef, (course) => {
    if (course) {
      const appliedCount = course.appliedCount || 0;
      course.appliedCount = appliedCount > 0 ? appliedCount - 1 : 0;
    }
    return course;
  })
    .then(() => {
      remove(appliedListRef);
      remove(appliedByStudentRef);

      msgEl.textContent = '신청이 취소되었습니다.';

      promoteWaiting(courseId);
    })
    .catch(() => {
      msgEl.textContent = '취소 중 오류가 발생했습니다.';
    });
}

//
// -------------------- 대기자 기능 --------------------
//

// 대기 신청
function applyWaiting(courseId) {
  const waitingRef =
    ref(db, 'courseWaiting/' + courseId + '/' + encodeURIComponent(student.name));

  const waitingByStudentRef =
    ref(db, 'courseWaitingByStudent/' + encodeURIComponent(student.name) + '/' + courseId);

  set(waitingRef, {
    grade: student.grade,
    class: student.class,
    name: student.name,
    timestamp: Date.now()
  });

  set(waitingByStudentRef, true);

  msgEl.textContent = '대기 신청이 완료되었습니다.';
}

// 대기 취소
function cancelWaiting(courseId) {
  remove(ref(db, 'courseWaiting/' + courseId + '/' + encodeURIComponent(student.name)));
  remove(ref(db, 'courseWaitingByStudent/' + encodeURIComponent(student.name) + '/' + courseId));
  msgEl.textContent = '대기 신청이 취소되었습니다.';
}

// 대기 승급 처리
function promoteWaiting(courseId) {
  const waitingRef = ref(db, 'courseWaiting/' + courseId);

  get(waitingRef).then((snap) => {
    const waitingList = snap.val();
    if (!waitingList) return;

    const entries = Object.entries(waitingList);
    if (!entries.length) return;

    entries.sort((a, b) => a[1].timestamp - b[1].timestamp);
    const [studentKey, stu] = entries[0];

    applyCourseDirect(courseId, stu, studentKey);
  });
}

// 승급 시 시간 중복 체크 포함
function applyCourseDirect(courseId, stu, studentKey) {
  const appliedRef = ref(db, 'appliedByStudent/' + studentKey);

  get(appliedRef).then((snap) => {
    const hisApplied = snap.val() || {};

    // 시간 중복 체크
    const myTimeList = getMyAppliedTimeList(allCoursesCache, hisApplied);
    const newTime = parseTimeStr(allCoursesCache[courseId].time);

    for (const t of myTimeList) {
      if (isTimeConflict(t, newTime)) {
        // 시간 충돌 → 승급 불가 → 대기 제거만 수행
        remove(ref(db, 'courseWaiting/' + courseId + '/' + studentKey));
        remove(ref(db, 'courseWaitingByStudent/' + studentKey + '/' + courseId));
        return;
      }
    }

    // 정상 승급 진행
    const courseRef = ref(db, 'courses/' + courseId);
    const appliedListRef = ref(db, 'courseApplied/' + courseId + '/' + studentKey);
    const appliedByStudentRef = ref(db, 'appliedByStudent/' + studentKey + '/' + courseId);

    runTransaction(courseRef, (course) => {
      if (course) {
        const capacity = course.capacity || 0;
        const appliedCount = course.appliedCount || 0;
        if (capacity && appliedCount >= capacity) return;

        course.appliedCount = appliedCount + 1;
      }
      return course;
    }).then(() => {
      remove(ref(db, 'courseWaiting/' + courseId + '/' + studentKey));
      remove(ref(db, 'courseWaitingByStudent/' + studentKey + '/' + courseId));

      set(appliedListRef, {
        grade: stu.grade,
        class: stu.class,
        name: stu.name
      });

      set(appliedByStudentRef, true);
    });
  });
}

loadStudent();
if (student) watchCourses();

</script>
</body>
</html>
