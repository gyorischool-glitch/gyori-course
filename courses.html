<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>교리초 방과후 수강신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      max-width: 1100px;
      margin: 20px auto;
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
    }
    h2 { margin: 0 0 10px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .student { font-size: 14px; color: #374151; }
    .logout-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      background: #ef4444;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #e5e7eb;
      font-size: 14px;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }
    .hidden { display: none; }

    .msg {
      font-size: 14px;
      margin: 8px 0;
      color: #ef4444;
    }

    .countdownBox {
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      font-size: 14px;
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 6px 4px;
      text-align: left;
      white-space: nowrap;
    }
    th { background: #f3f4f6; }

    button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-apply { background: #2563eb; color: #fff; }
    .btn-cancel { background: #ef4444; color: #fff; }

    @media (max-width: 768px) {
      .wrap { margin: 0; border-radius: 0; box-shadow: none; }
      table { display: block; overflow-x: auto; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>

<body>
<div class="wrap">
  <h2>수강신청</h2>

  <div class="topbar">
    <div id="studentInfo" class="student"></div>
    <button id="logoutBtn" class="logout-btn">로그아웃</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="list">프로그램 목록</button>
    <button class="tab-btn" data-tab="mypage">마이페이지</button>
    <button class="tab-btn" data-tab="timetable">시간표</button>
  </div>

  <div id="msg" class="msg"></div>
  <div id="countdownBox" class="countdownBox"></div>

  <!-- 프로그램 목록 -->
  <div id="tab-list">
    <table>
      <thead>
      <tr>
        <th>구분</th>
        <th>과목명</th>
        <th>요일</th>
        <th>시간</th>
        <th>대상 학년</th>
        <th>강사</th>
        <th>정원</th>
        <th>신청</th>
      </tr>
      </thead>
      <tbody id="courseTbody"></tbody>
    </table>
  </div>

  <!-- 마이페이지 -->
  <div id="tab-mypage" class="hidden">
    <h3>나의 신청 내역</h3>
    <table>
      <thead>
      <tr>
        <th>구분</th>
        <th>과목명</th>
        <th>요일</th>
        <th>시간</th>
        <th>상태</th>
        <th>취소</th>
      </tr>
      </thead>
      <tbody id="myTbody"></tbody>
    </table>
  </div>

  <!-- 시간표 -->
  <div id="tab-timetable" class="hidden">
    <h3>시간표</h3>
    <table>
      <thead>
      <tr>
        <th>시간</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
      </tr>
      </thead>
      <tbody id="timetableBody"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

/* =====================
   학생 정보 / 로그아웃
===================== */
const studentInfoEl = document.getElementById("studentInfo");
const logoutBtn = document.getElementById("logoutBtn");

let student = JSON.parse(localStorage.getItem("gyori_student") || "null");
if (!student) location.href = "login.html";

studentInfoEl.textContent =
  `${student.grade}학년 ${student.class}반 ${student.name} 학생`;

logoutBtn.onclick = () => {
  localStorage.removeItem("gyori_student");
  location.href = "login.html";
};

/* =====================
   탭 전환
===================== */
const tabs = document.querySelectorAll(".tab-btn");
const tabList = document.getElementById("tab-list");
const tabMy = document.getElementById("tab-mypage");
const tabTime = document.getElementById("tab-timetable");

tabs.forEach(btn => {
  btn.onclick = () => {
    tabs.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const t = btn.dataset.tab;
    tabList.classList.toggle("hidden", t !== "list");
    tabMy.classList.toggle("hidden", t !== "mypage");
    tabTime.classList.toggle("hidden", t !== "timetable");

    applyListVisibilityRules();
  };
});

/* =====================
   서버 시간
===================== */
let serverOffset = 0;
onValue(ref(db, ".info/serverTimeOffset"), snap => {
  serverOffset = snap.val() || 0;
});
const nowServerMs = () => Date.now() + serverOffset;

/* =====================
   신청기간
===================== */
let settings = {};
onValue(ref(db, "settings"), snap => {
  settings = snap.val() || {};
  applyListVisibilityRules();
  startCountdown();
});

function getPeriods() {
  const p = settings.applyPeriods || {};
  return {
    free: p.free || {},
    paid: p.paid || {}
  };
}

function canShowAnyList(now) {
  const { free, paid } = getPeriods();
  return (
    (free.startMs && now >= free.startMs && (!free.endMs || now <= free.endMs)) ||
    (paid.startMs && now >= paid.startMs && (!paid.endMs || now <= paid.endMs))
  );
}

/* ✅ 최종 확정 함수 (중복 없음) */
function applyListVisibilityRules(){
  if (!document.querySelector('.tab-btn.active')?.dataset?.tab === 'list') return;

  const now = nowServerMs();
  const { free, paid } = getPeriods();

  const afterFree = free.endMs && now > free.endMs;
  const afterPaid = paid.endMs && now > paid.endMs;

  if (afterFree && afterPaid) {
    tabList.style.display = "none";
    msg.textContent = "신청 기간이 종료되었습니다. 마이페이지를 확인하세요.";
    return;
  }

  if (!canShowAnyList(now)) {
    tabList.style.display = "none";
    msg.textContent = "현재 수강신청 기간이 아닙니다.";
    return;
  }

  tabList.style.display = "";
  msg.textContent = "";
}

/* =====================
   카운트다운 (3분)
===================== */
const countdownBox = document.getElementById("countdownBox");
let timer = null;

function startCountdown(){
  if (timer) clearInterval(timer);

  const now = nowServerMs();
  const { free, paid } = getPeriods();
  const starts = [free.startMs, paid.startMs].filter(s => s && s > now);
  if (!starts.length) {
    countdownBox.style.display = "none";
    return;
  }

  const next = Math.min(...starts);
  if (next - now > 180000) {
    countdownBox.style.display = "none";
    return;
  }

  countdownBox.style.display = "block";
  timer = setInterval(() => {
    const diff = next - nowServerMs();
    if (diff <= 0) {
      location.reload();
      return;
    }
    const m = Math.floor(diff / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    countdownBox.innerHTML =
      `수강신청 시작까지 <b>${m}분 ${String(s).padStart(2,"0")}초</b> 남았습니다.`;
  }, 1000);
}

/* =====================
   과목 데이터
===================== */
let courses = {};
onValue(ref(db, "courses"), snap => {
  courses = snap.val() || {};
  renderCourses();
});

function renderCourses(){
  const tbody = document.getElementById("courseTbody");
  tbody.innerHTML = "";

  Object.values(courses).forEach(c => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${c.category||""}</td>
      <td>${c.name||""}</td>
      <td>${c.day||""}</td>
      <td>${c.time||""}</td>
      <td>${c.minGrade||""}~${c.maxGrade||""}</td>
      <td>${c.teacher||""}</td>
      <td>${c.capacity||"-"}</td>
      <td><button class="btn-apply">신청</button></td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
