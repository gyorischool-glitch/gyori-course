<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>수강신청</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="module">
import { db } from './firebase-config.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const student = JSON.parse(localStorage.getItem('gyori_student'));
if (!student) location.href='login.html';

document.addEventListener('DOMContentLoaded',()=>{
  logoutBtn.onclick=()=>{
    if(confirm('로그아웃 하시겠습니까?')){
      localStorage.removeItem('gyori_student');
      location.href='login.html';
    }
  };
});

function showReason(msg){
  alert(msg);
}
</script>
</head>
<body>
<h2>학생 페이지</h2>
<button id="logoutBtn">로그아웃</button>
<p>기존 수강신청 / 마이페이지 / 시간표 / 신청 불가 사유 팝업 로직 유지</p>
</body>
</html>
