<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>수강신청 - 교리초</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin:0; padding:0; background:#f5f7fb; }
    .wrap { max-width:900px; margin:20px auto; background:#fff; border-radius:12px; padding:20px; box-shadow:0 8px 20px rgba(0,0,0,.06); }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:14px; }
    h2 { margin:8px 0 12px; font-size:20px; }
    .student { font-size:14px; margin-bottom:8px; color:#374151; }
    .msg { margin-top:4px; font-size:13px; min-height:18px; color:#2563eb; }
    a { color:#2563eb; text-decoration:none; }

    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
    th, td { border-bottom:1px solid #e5e7eb; padding:8px 6px; text-align:left; }
    th { background:#f3f4f6; }

    button { padding:6px 10px; border-radius:6px; border:none; cursor:pointer; font-size:13px; }
    .btn-primary { background:#2563eb; color:#fff; }
    .btn-danger  { background:#ef4444; color:#fff; }
    .btn-ghost   { background:#e5e7eb; color:#374151; }

    .tabs { display:flex; gap:6px; margin:10px 0; }
    .tab-btn { padding:6px 10px; border-radius:999px; border:1px solid #d1d5db; background:#f9fafb; cursor:pointer; font-size:13px; }
    .tab-btn.active { background:#2563eb; color:#fff; border-color:#2563eb; }

    .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
    .filters select,
    .filters input { padding:4px 6px; border-radius:999px; border:1px solid #d1d5db; font-size:13px; background:#f9fafb; }

    .section { margin-top:12px; }

    .status-good { color:#16a34a; }
    .status-bad  { color:#ef4444; }

    .modal-backdrop {
      position:fixed; inset:0;
      background:rgba(0,0,0,.4);
      display:none; align-items:center; justify-content:center;
      z-index:50;
    }
    .modal {
      background:#fff; border-radius:12px; padding:16px;
      max-width:480px; width:90%;
      box-shadow:0 10px 25px rgba(0,0,0,.15);
      font-size:14px;
    }
    .modal h3 { margin-top:0; font-size:18px; }
    .modal-row { margin-bottom:6px; }
    .badge { display:inline-block; padding:2px 6px; border-radius:999px; background:#e5e7eb; font-size:11px; margin-right:4px; }

    .timetable { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    .timetable th, .timetable td { border:1px solid #e5e7eb; padding:6px 4px; text-align:center; }
    .tt-course { font-size:12px; line-height:1.3; }

    .autocomplete-wrapper { position:relative; }
    .autocomplete-list {
      position:absolute;
      left:0; right:0;
      top:100%;
      margin-top:2px;
      background:#fff;
      border:1px solid #d1d5db;
      border-radius:8px;
      box-shadow:0 8px 16px rgba(0,0,0,.08);
      z-index:20;
      font-size:13px;
      max-height:180px;
      overflow-y:auto;
      display:none;
    }
    .autocomplete-item {
      padding:6px 8px;
      cursor:pointer;
    }
    .autocomplete-item:hover {
      background:#eff6ff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div><strong>교리초 수강신청</strong></div>
      <div><a href="index.html">← 메인으로</a></div>
    </div>
    <h2>수강신청</h2>
    <div class="student" id="studentInfo"></div>
    <div class="msg" id="msg"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="list">프로그램 목록</button>
      <button class="tab-btn" data-tab="mypage">마이페이지</button>
      <button class="tab-btn" data-tab="timetable">시간표 보기</button>
    </div>

    <div id="tab-list" class="tab-panel">
      <div class="filters">
        <span style="font-size:13px; color:#6b7280;">필터:</span>
        <select id="filterCategory">
          <option value="">구분 전체</option>
        </select>
        <div class="autocomplete-wrapper">
          <input id="filterName" placeholder="과목명" style="width:130px;" />
          <div id="nameSuggestions" class="autocomplete-list"></div>
        </div>
        <select id="filterDay">
          <option value="">요일 전체</option>
          <option value="월">월</option>
          <option value="화">화</option>
          <option value="수">수</option>
          <option value="목">목</option>
          <option value="금">금</option>
        </select>
        <select id="filterGrade">
          <option value="">학년 전체</option>
          <option value="1">1학년</option>
          <option value="2">2학년</option>
          <option value="3">3학년</option>
          <option value="4">4학년</option>
          <option value="5">5학년</option>
          <option value="6">6학년</option>
        </select>
        <input id="filterTeacher" placeholder="강사명" style="width:100px;" />
        <button id="filterResetBtn" class="btn-ghost">초기화</button>
      </div>

      <table id="courseTable">
        <thead>
          <tr>
            <th>과목</th>
            <th>구분</th>
            <th>대상 학년</th>
            <th>시간</th>
            <th>정원</th>
            <th>신청 상태</th>
            <th>신청</th>
            <th>상세</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="tab-mypage" class="tab-panel" style="display:none;">
      <div class="section">
        <h3 style="font-size:16px; margin-bottom:4px;">신청한 프로그램</h3>
        <table id="myAppliedTable">
          <thead>
            <tr>
              <th>과목</th>
              <th>시간</th>
              <th>정원</th>
              <th>상태</th>
              <th>취소</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="section">
        <h3 style="font-size:16px; margin-bottom:4px;">대기 중인 프로그램</h3>
        <table id="myWaitingTable">
          <thead>
            <tr>
              <th>과목</th>
              <th>시간</th>
              <th>대기 순번</th>
              <th>정원</th>
              <th>취소</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div id="tab-timetable" class="tab-panel" style="display:none;">
      <div class="section">
        <h3 style="font-size:16px; margin-bottom:4px;">주간 시간표</h3>
        <table class="timetable" id="timetable">
          <thead>
            <tr>
              <th>교시</th>
              <th>월</th>
              <th>화</th>
              <th>수</th>
              <th>목</th>
              <th>금</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="detailModalBackdrop">
    <div class="modal">
      <h3 id="detailTitle"></h3>
      <div class="modal-row"><span class="badge">구분</span><span id="detailCategory"></span></div>
      <div class="modal-row"><span class="badge">대상</span><span id="detailTarget"></span></div>
      <div class="modal-row"><span class="badge">시간</span><span id="detailTime"></span></div>
      <div class="modal-row"><span class="badge">장소</span><span id="detailPlace"></span></div>
      <div class="modal-row"><span class="badge">강사</span><span id="detailTeacher"></span></div>
      <div class="modal-row"><span class="badge">기간</span><span id="detailPeriod"></span></div>
      <div class="modal-row"><span class="badge">준비물</span><span id="detailMaterials"></span></div>
      <div class="modal-row"><span class="badge">소개</span></div>
      <div class="modal-row" id="detailDescription" style="white-space:pre-wrap;"></div>
      <div style="text-align:right; margin-top:10px;">
        <button id="detailCloseBtn" class="btn-ghost">닫기</button>
      </div>
    </div>
  </div>

<script type="module">
import { app, db } from './firebase-config.js';
import {
  ref,
  onValue,
  runTransaction,
  set,
  remove,
  get
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const studentInfoEl = document.getElementById('studentInfo');
const msgEl = document.getElementById('msg');
const tbody = document.querySelector('#courseTable tbody');

const myAppliedTbody  = document.querySelector('#myAppliedTable tbody');
const myWaitingTbody  = document.querySelector('#myWaitingTable tbody');
const timetableBody   = document.querySelector('#timetable tbody');

const tabs = document.querySelectorAll('.tab-btn');
const tabPanels = {
  list: document.getElementById('tab-list'),
  mypage: document.getElementById('tab-mypage'),
  timetable: document.getElementById('tab-timetable'),
};

const filterCategory = document.getElementById('filterCategory');
const filterName = document.getElementById('filterName');
const filterDay = document.getElementById('filterDay');
const filterGrade = document.getElementById('filterGrade');
const filterTeacher = document.getElementById('filterTeacher');
const filterResetBtn = document.getElementById('filterResetBtn');
const nameSuggestions = document.getElementById('nameSuggestions');

const detailBackdrop = document.getElementById('detailModalBackdrop');
const detailCloseBtn = document.getElementById('detailCloseBtn');
const detailTitle = document.getElementById('detailTitle');
const detailCategory = document.getElementById('detailCategory');
const detailTarget = document.getElementById('detailTarget');
const detailTime = document.getElementById('detailTime');
const detailPlace = document.getElementById('detailPlace');
const detailTeacher = document.getElementById('detailTeacher');
const detailPeriod = document.getElementById('detailPeriod');
const detailMaterials = document.getElementById('detailMaterials');
const detailDescription = document.getElementById('detailDescription');

let student = null;
let applyStart = null;
let applyEnd   = null;

let allCoursesCache   = {};
let myAppliedCache    = {};
let myWaitingCache    = {};
let courseWaitingCache = {};

const MAX_PERIOD = 7;

function parseTimeStr(str) {
  if (!str) return null;
  const m = str.match(/([월화수목금토일])\s*(\d+)\s*~\s*(\d+)교시/);
  if (!m) return null;
  return {
    day: m[1],
    start: parseInt(m[2], 10),
    end: parseInt(m[3], 10),
  };
}
function isTimeConflict(t1, t2) {
  if (!t1 || !t2) return false;
  if (t1.day !== t2.day) return false;
  return !(t1.end < t2.start || t2.end < t1.start);
}
function getMyAppliedTimeList(courses, appliedMap) {
  const list = [];
  if (!courses || !appliedMap) return list;
  Object.entries(appliedMap).forEach(([cid, v]) => {
    if (v && courses[cid]) {
      const t = parseTimeStr(courses[cid].time);
      if (t) list.push(t);
    }
  });
  return list;
}
function isApplyPeriod() {
  const now = Date.now();
  if (applyStart && now < applyStart) return false;
  if (applyEnd   && now > applyEnd)   return false;
  return true;
}
function isCancelAllowed(course) {
  if (!course || !course.cancelDeadline) return true;
  const now = Date.now();
  return now <= course.cancelDeadline;
}
function getMyWaitingPosition(courseId) {
  const waitingForCourse = (courseWaitingCache && courseWaitingCache[courseId]) || null;
  if (!waitingForCourse) return null;
  const entries = Object.entries(waitingForCourse);
  entries.sort((a,b) => (a[1].timestamp||0) - (b[1].timestamp||0));
  const myKey = makeStudentKey(student.name);
  const idx = entries.findIndex(([key]) => key === myKey);
  return idx === -1 ? null : idx + 1;
}
function makeStudentKey(name) {
  return encodeURIComponent(name);
}

function loadStudent() {
  const raw = localStorage.getItem('gyori_student');
  if (!raw) {
    studentInfoEl.textContent = '학생 정보가 없습니다. 처음 화면으로 돌아가 다시 입력해 주세요.';
    return;
  }
  student = JSON.parse(raw);
  studentInfoEl.textContent = `학년: ${student.grade} / 반: ${student.class} / 이름: ${student.name}`;
}

function loadApplyPeriod() {
  const settingsRef = ref(db, 'settings');
  onValue(settingsRef, (snap) => {
    const data = snap.val() || {};
    applyStart = data.applyStart || null;
    applyEnd   = data.applyEnd   || null;
    if (!isApplyPeriod()) {
      msgEl.textContent = '지금은 수강신청 기간이 아닙니다.';
    } else {
      msgEl.textContent = '';
    }
  });
}

function refreshAllViews() {
  if (!student) return;
  renderFilters();
  renderCourseList();
  renderMyPage();
  renderTimetable();
}

function watchData() {
  if (!student) return;

  const coursesRef = ref(db, 'courses');
  const appliedRef = ref(db, 'appliedByStudent/' + makeStudentKey(student.name));
  const waitingByStudentRef = ref(db, 'courseWaitingByStudent/' + makeStudentKey(student.name));
  const waitingAllRef = ref(db, 'courseWaiting');

  onValue(coursesRef, (snap) => {
    allCoursesCache = snap.val() || {};
    refreshAllViews();
  });

  onValue(appliedRef, (snap) => {
    myAppliedCache = snap.val() || {};
    refreshAllViews();
  });

  onValue(waitingByStudentRef, (snap) => {
    myWaitingCache = snap.val() || {};
    refreshAllViews();
  });

  onValue(waitingAllRef, (snap) => {
    courseWaitingCache = snap.val() || {};
    refreshAllViews();
  });
}

function renderFilters() {
  const categories = new Set();
  Object.values(allCoursesCache).forEach(c => {
    if (c.category) categories.add(c.category);
  });
  const current = filterCategory.value;
  filterCategory.innerHTML = '<option value="">구분 전체</option>';
  categories.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    filterCategory.appendChild(opt);
  });
  filterCategory.value = current || '';
}

function renderCourseList() {
  tbody.innerHTML = '';
  if (!student) return;

  const gradeNum = parseInt(student.grade, 10);
  const myTimes = getMyAppliedTimeList(allCoursesCache, myAppliedCache);

  const filterCat = filterCategory.value.trim();
  const filterN   = filterName.value.trim();
  const filterD   = filterDay.value.trim();
  const filterG   = filterGrade.value.trim();
  const filterT   = filterTeacher.value.trim();
  const inPeriod  = isApplyPeriod();

  Object.entries(allCoursesCache || {}).forEach(([id, c]) => {
    const minG = parseInt(c.minGrade, 10);
    const maxG = parseInt(c.maxGrade, 10);

    if (filterG) {
      const target = parseInt(filterG, 10);
      const effMin = isNaN(minG) ? 1 : minG;
      const effMax = isNaN(maxG) ? 6 : maxG;
      if (!(target >= effMin && target <= effMax)) return;
    }
    if (filterCat && c.category !== filterCat) return;
    if (filterN && (!c.name || !c.name.includes(filterN))) return;

    const t = parseTimeStr(c.time || '');
    if (filterD) {
      if (!t || t.day !== filterD) return;
    }
    if (filterT && (!c.teacher || !c.teacher.includes(filterT))) return;

    const tr = document.createElement('tr');

    const appliedCount = c.appliedCount || 0;
    const capacity = c.capacity || 0;
    const isFull = capacity > 0 && appliedCount >= capacity;

    const isApplied = myAppliedCache && myAppliedCache[id];
    const isWaiting = myWaitingCache && myWaitingCache[id];
    const myWaitPos = isWaiting ? getMyWaitingPosition(id) : null;

    const gradeOk = !isNaN(gradeNum) &&
                    (isNaN(minG) || gradeNum >= minG) &&
                    (isNaN(maxG) || gradeNum <= maxG);
    const timeConflict = !isApplied && !isWaiting && t && myTimes.some(mt => isTimeConflict(mt, t));

    let statusText = '';
    if (!inPeriod) statusText = '기간외';
    else if (isApplied) statusText = '신청완료';
    else if (isWaiting) statusText = myWaitPos ? `대기중 (${myWaitPos}번)` : '대기중';
    else if (!gradeOk) statusText = '대상학년 아님';
    else if (timeConflict) statusText = '시간 겹침';
    else if (isFull) statusText = '정원 마감(대기 가능)';
    else statusText = '신청 가능';

    tr.innerHTML = `
      <td>${c.name || ''}</td>
      <td>${c.category || '-'}</td>
      <td>${c.minGrade || ''}~${c.maxGrade || ''}</td>
      <td>${c.time || ''}</td>
      <td>${appliedCount}/${capacity || '-'}</td>
      <td>${statusText}</td>
      <td></td>
      <td><button class="btn-ghost" data-detail="${id}">상세보기</button></td>
    `;

    const btnCell = tr.children[6];
    const btn = document.createElement('button');

    if (!inPeriod) {
      btn.textContent = '기간외';
      btn.disabled = true;
      btn.className = 'btn-ghost';
    } else if (isApplied) {
      btn.textContent = '신청취소';
      btn.className = 'btn-danger';
      btn.onclick = () => cancelCourse(id);
    } else if (isWaiting) {
      btn.textContent = '대기취소';
      btn.className = 'btn-danger';
      btn.onclick = () => cancelWaiting(id);
    } else if (!gradeOk || timeConflict) {
      btn.textContent = '신청불가';
      btn.disabled = true;
      btn.className = 'btn-ghost';
    } else if (isFull) {
      btn.textContent = '대기신청';
      btn.className = 'btn-primary';
      btn.onclick = () => applyWaiting(id);
    } else {
      btn.textContent = '신청';
      btn.className = 'btn-primary';
      btn.onclick = () => applyCourse(id);
    }

    btnCell.appendChild(btn);

    const detailBtn = tr.querySelector('[data-detail]');
    detailBtn.addEventListener('click', () => openDetailModal(id));

    tbody.appendChild(tr);
  });

  if (!tbody.children.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 8;
    td.textContent = '조건에 맞는 프로그램이 없습니다.';
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

function updateNameSuggestions() {
  const q = filterName.value.trim();
  nameSuggestions.innerHTML = '';
  if (!q) {
    nameSuggestions.style.display = 'none';
    return;
  }

  const names = new Set();
  Object.values(allCoursesCache || {}).forEach(c => {
    if (c.name && c.name.includes(q)) names.add(c.name);
  });
  const items = Array.from(names).slice(0, 8);

  if (!items.length) {
    nameSuggestions.style.display = 'none';
    return;
  }

  items.forEach(name => {
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.textContent = name;
    div.addEventListener('mousedown', (e) => {
      e.preventDefault();
      filterName.value = name;
      nameSuggestions.style.display = 'none';
      renderCourseList();
    });
    nameSuggestions.appendChild(div);
  });

  nameSuggestions.style.display = 'block';
}

filterName.addEventListener('input', () => {
  updateNameSuggestions();
  renderCourseList();
});
filterName.addEventListener('focus', () => {
  updateNameSuggestions();
});
filterName.addEventListener('blur', () => {
  setTimeout(() => { nameSuggestions.style.display = 'none'; }, 150);
});

function openDetailModal(courseId) {
  const c = allCoursesCache[courseId];
  if (!c) return;

  detailTitle.textContent = c.name || '';
  detailCategory.textContent = c.category || '미입력';
  detailTarget.textContent = `${c.minGrade || ''}~${c.maxGrade || ''}`;
  detailTime.textContent = c.time || '미입력';
  detailPlace.textContent = c.place || '미입력';
  detailTeacher.textContent = c.teacher || '미입력';
  detailPeriod.textContent = c.period || '미입력';
  detailMaterials.textContent = c.materials || '미입력';
  detailDescription.textContent = c.description || '등록된 강의 소개가 없습니다.';

  detailBackdrop.style.display = 'flex';
}
detailCloseBtn.onclick = () => detailBackdrop.style.display = 'none';
detailBackdrop.addEventListener('click', (e) => {
  if (e.target === detailBackdrop) detailBackdrop.style.display = 'none';
});

function renderMyPage() {
  myAppliedTbody.innerHTML = '';
  myWaitingTbody.innerHTML = '';
  if (!student) return;

  const inPeriod = isApplyPeriod();

  Object.entries(myAppliedCache || {}).forEach(([cid, v]) => {
    const c = allCoursesCache[cid];
    if (!c) return;

    const tr = document.createElement('tr');
    const appliedCount = c.appliedCount || 0;
    const capacity = c.capacity || 0;
    const cancelOk = isCancelAllowed(c);
    const statusText = cancelOk ? '취소 가능' : '취소 불가(마감 지남)';

    tr.innerHTML = `
      <td>${c.name || ''}</td>
      <td>${c.time || ''}</td>
      <td>${appliedCount}/${capacity || '-'}</td>
      <td class="${cancelOk ? 'status-good' : 'status-bad'}">${statusText}</td>
      <td></td>
    `;
    const btnCell = tr.lastElementChild;
    const btn = document.createElement('button');

    if (!inPeriod || !cancelOk) {
      btn.textContent = '취소 불가';
      btn.disabled = true;
      btn.className = 'btn-ghost';
    } else {
      btn.textContent = '신청취소';
      btn.className = 'btn-danger';
      btn.onclick = () => cancelCourse(cid);
    }

    btnCell.appendChild(btn);
    myAppliedTbody.appendChild(tr);
  });

  if (!myAppliedTbody.children.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = '신청한 프로그램이 없습니다.';
    tr.appendChild(td);
    myAppliedTbody.appendChild(tr);
  }

  Object.entries(myWaitingCache || {}).forEach(([cid, v]) => {
    const c = allCoursesCache[cid];
    if (!c) return;
    const pos = getMyWaitingPosition(cid);
    const appliedCount = c.appliedCount || 0;
    const capacity = c.capacity || 0;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${c.name || ''}</td>
      <td>${c.time || ''}</td>
      <td>${pos ? pos + '번' : '-'}</td>
      <td>${appliedCount}/${capacity || '-'}</td>
      <td></td>
    `;
    const btnCell = tr.lastElementChild;
    const btn = document.createElement('button');

    if (!inPeriod) {
      btn.textContent = '취소 불가';
      btn.disabled = true;
      btn.className = 'btn-ghost';
    } else {
      btn.textContent = '대기취소';
      btn.className = 'btn-danger';
      btn.onclick = () => cancelWaiting(cid);
    }

    btnCell.appendChild(btn);
    myWaitingTbody.appendChild(tr);
  });

  if (!myWaitingTbody.children.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = '대기 중인 프로그램이 없습니다.';
    tr.appendChild(td);
    myWaitingTbody.appendChild(tr);
  }
}

function renderTimetable() {
  timetableBody.innerHTML = '';

  const grid = {};
  for (let p = 1; p <= MAX_PERIOD; p++) {
    grid[p] = { '월': '', '화': '', '수': '', '목': '', '금': '' };
  }

  Object.entries(myAppliedCache || {}).forEach(([cid, v]) => {
    const c = allCoursesCache[cid];
    if (!c) return;
    const t = parseTimeStr(c.time || '');
    if (!t) return;

    for (let p = t.start; p <= t.end && p <= MAX_PERIOD; p++) {
      grid[p][t.day] = (grid[p][t.day]
        ? grid[p][t.day] + ' / ' + (c.name || '')
        : (c.name || ''));
    }
  });

  for (let p = 1; p <= MAX_PERIOD; p++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p}교시</td>
      <td class="tt-course">${grid[p]['월']}</td>
      <td class="tt-course">${grid[p]['화']}</td>
      <td class="tt-course">${grid[p]['수']}</td>
      <td class="tt-course">${grid[p]['목']}</td>
      <td class="tt-course">${grid[p]['금']}</td>
    `;
    timetableBody.appendChild(tr);
  }
}

function applyCourse(courseId) {
  if (!student) return;
  if (!isApplyPeriod()) {
    msgEl.textContent = '지금은 신청 기간이 아닙니다.';
    return;
  }

  const course = allCoursesCache[courseId];
  if (!course) return;

  const myTimes = getMyAppliedTimeList(allCoursesCache, myAppliedCache);
  const newTime = parseTimeStr(course.time || '');
  if (newTime && myTimes.some(t => isTimeConflict(t, newTime))) {
    msgEl.textContent = '이미 같은 시간대의 과목을 신청했습니다.';
    return;
  }

  const studentKey = makeStudentKey(student.name);
  const courseRef = ref(db, 'courses/' + courseId);
  const appliedListRef = ref(db, 'courseApplied/' + courseId + '/' + studentKey);
  const appliedByStudentRef = ref(db, 'appliedByStudent/' + studentKey + '/' + courseId);

  msgEl.textContent = '';

  runTransaction(courseRef, (c) => {
    if (!c) return c;
    const cap = c.capacity || 0;
    const cnt = c.appliedCount || 0;
    if (cap && cnt >= cap) {
      return;
    }
    c.appliedCount = cnt + 1;
    return c;
  }).then((result) => {
    if (!result.committed || !result.snapshot.exists()) {
      msgEl.textContent = '정원이 가득 찼습니다.';
      return;
    }
    return Promise.all([
      set(appliedListRef, {
        grade: student.grade,
        class: student.class,
        name: student.name,
      }),
      set(appliedByStudentRef, true),
    ]);
  }).then(() => {
    msgEl.textContent = msgEl.textContent || '신청이 완료되었습니다.';
  }).catch((e) => {
    console.error(e);
    msgEl.textContent = '신청 처리 중 오류가 발생했습니다.';
  });
}

function cancelCourse(courseId) {
  if (!student) return;
  const c = allCoursesCache[courseId];
  if (!c) return;

  if (!isApplyPeriod()) {
    msgEl.textContent = '지금은 신청 기간이 아닙니다.';
    return;
  }
  if (!isCancelAllowed(c)) {
    msgEl.textContent = '해당 프로그램은 취소 마감 시간이 지나 취소할 수 없습니다.';
    return;
  }

  msgEl.textContent = '';

  const studentKey = makeStudentKey(student.name);
  const courseRef = ref(db, 'courses/' + courseId);
  const appliedListRef = ref(db, 'courseApplied/' + courseId + '/' + studentKey);
  const appliedByStudentRef = ref(db, 'appliedByStudent/' + studentKey + '/' + courseId);

  runTransaction(courseRef, (course) => {
    if (course) {
      const cnt = course.appliedCount || 0;
      course.appliedCount = cnt > 0 ? cnt - 1 : 0;
    }
    return course;
  }).then(() => {
    return Promise.all([
      remove(appliedListRef),
      remove(appliedByStudentRef),
    ]);
  }).then(() => {
    promoteWaiting(courseId);
    msgEl.textContent = '신청이 취소되었습니다.';
  }).catch((e) => {
    console.error(e);
    msgEl.textContent = '취소 중 오류가 발생했습니다.';
  });
}

function applyWaiting(courseId) {
  if (!student) return;
  if (!isApplyPeriod()) {
    msgEl.textContent = '지금은 신청 기간이 아닙니다.';
    return;
  }

  const c = allCoursesCache[courseId];
  if (!c) return;

  if (myAppliedCache && myAppliedCache[courseId]) {
    msgEl.textContent = '이미 이 과목을 신청했습니다.';
    return;
  }
  if (myWaitingCache && myWaitingCache[courseId]) {
    msgEl.textContent = '이미 이 과목에 대기 중입니다.';
    return;
  }

  const myTimes = getMyAppliedTimeList(allCoursesCache, myAppliedCache);
  const t = parseTimeStr(c.time || '');
  if (t && myTimes.some(mt => isTimeConflict(mt, t))) {
    msgEl.textContent = '이미 같은 시간대의 과목을 신청했습니다.';
    return;
  }

  const studentKey = makeStudentKey(student.name);
  const waitingRef = ref(db, 'courseWaiting/' + courseId + '/' + studentKey);
  const waitingByStudentRef = ref(db, 'courseWaitingByStudent/' + studentKey + '/' + courseId);
  const now = Date.now();

  Promise.all([
    set(waitingRef, {
      grade: student.grade,
      class: student.class,
      name: student.name,
      timestamp: now,
    }),
    set(waitingByStudentRef, true),
  ]).then(() => {
    msgEl.textContent = '대기 신청이 완료되었습니다.';
  }).catch((e) => {
    console.error(e);
    msgEl.textContent = '대기 신청 중 오류가 발생했습니다.';
  });
}

function cancelWaiting(courseId) {
  if (!student) return;
  if (!isApplyPeriod()) {
    msgEl.textContent = '지금은 신청 기간이 아닙니다.';
    return;
  }

  const studentKey = makeStudentKey(student.name);
  Promise.all([
    remove(ref(db, 'courseWaiting/' + courseId + '/' + studentKey)),
    remove(ref(db, 'courseWaitingByStudent/' + studentKey + '/' + courseId)),
  ]).then(() => {
    msgEl.textContent = '대기 신청이 취소되었습니다.';
  }).catch((e) => {
    console.error(e);
    msgEl.textContent = '대기 취소 중 오류가 발생했습니다.';
  });
}

function promoteWaiting(courseId) {
  const waitingRef = ref(db, 'courseWaiting/' + courseId);
  get(waitingRef).then((snap) => {
    const list = snap.val();
    if (!list) return;

    const arr = Object.entries(list);
    if (!arr.length) return;

    arr.sort((a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0));
    const [studentKey, stu] = arr[0];
    applyCourseDirect(courseId, stu, studentKey);
  }).catch((e) => {
    console.error(e);
  });
}

function applyCourseDirect(courseId, stu, studentKey) {
  const courseRef = ref(db, 'courses/' + courseId);
  const appliedListRef = ref(db, 'courseApplied/' + courseId + '/' + studentKey);
  const appliedByStudentRef = ref(db, 'appliedByStudent/' + studentKey + '/' + courseId);

  get(ref(db, 'appliedByStudent/' + studentKey)).then((snap) => {
    const hisApplied = snap.val() || {};
    const hisTimes = getMyAppliedTimeList(allCoursesCache, hisApplied);
    const c = allCoursesCache[courseId];
    if (!c) return;

    const newTime = parseTimeStr(c.time || '');
    if (newTime && hisTimes.some(t => isTimeConflict(t, newTime))) {
      return Promise.all([
        remove(ref(db, 'courseWaiting/' + courseId + '/' + studentKey)),
        remove(ref(db, 'courseWaitingByStudent/' + studentKey + '/' + courseId)),
      ]);
    }

    return runTransaction(courseRef, (course) => {
      if (!course) return course;
      const cap = course.capacity || 0;
      const cnt = course.appliedCount || 0;
      if (cap && cnt >= cap) {
        return;
      }
      course.appliedCount = cnt + 1;
      return course;
    }).then((result) => {
      if (!result.committed || !result.snapshot.exists()) {
        return;
      }
      const removes = [
        remove(ref(db, 'courseWaiting/' + courseId + '/' + studentKey)),
        remove(ref(db, 'courseWaitingByStudent/' + studentKey + '/' + courseId)),
      ];
      const sets = [
        set(appliedListRef, {
          grade: stu.grade,
          class: stu.class,
          name: stu.name,
        }),
        set(appliedByStudentRef, true),
      ];
      return Promise.all([...removes, ...sets]);
    });
  }).catch((e) => {
    console.error(e);
  });
}

tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const tab = btn.dataset.tab;
    Object.entries(tabPanels).forEach(([key, el]) => {
      el.style.display = (key === tab) ? 'block' : 'none';
    });
  });
});

filterCategory.addEventListener('change', renderCourseList);
filterDay.addEventListener('change', renderCourseList);
filterGrade.addEventListener('change', renderCourseList);
filterTeacher.addEventListener('input', renderCourseList);
filterResetBtn.addEventListener('click', () => {
  filterCategory.value = '';
  filterName.value = '';
  filterDay.value = '';
  filterGrade.value = '';
  filterTeacher.value = '';
  nameSuggestions.style.display = 'none';
  renderCourseList();
});

loadStudent();
if (student) {
  loadApplyPeriod();
  watchData();
}
