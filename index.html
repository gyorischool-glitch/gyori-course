<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학생용 수강신청</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/main.min.css' rel='stylesheet' />
</head>
<body>

<h2>📚 교리초 수강신청</h2>

<div id="userInfo" class="card">
    <p><strong>학년/반/이름:</strong> <span id="studentName"></span></p>
    <button onclick="logout()">로그아웃</button>
</div>

<div class="menu">
    <button onclick="showCourseList()">📖 강의 신청</button>
    <button onclick="showMyPage()">📝 내 수강 내역</button>
</div>

<!-- 강좌 목록 (테이블 UI) -->
<div id="courseContainer" class="section hidden">

    <h3 class="title">강좌신청 및 취소</h3>

    <!-- 상단 고정 검색바 + 개설 강좌 수 -->
    <div class="course-header">
        <div class="course-count">
            현재 개설된 강좌개수는 <span id="courseCount">0</span>건입니다
        </div>

        <div class="course-search">
            <select id="searchField">
                <option value="name">강좌명</option>
                <option value="teacher">강사명</option>
            </select>
            <input type="text" id="searchKeyword" placeholder="검색어를 입력해주세요">
            <button type="button" onclick="searchCourses()" class="search-btn">🔍 검색</button>
        </div>
    </div>

    <!-- 강좌 표 -->
    <div class="table-wrapper">
        <table class="course-table">
            <thead>
                <tr>
                    <th>
                        <input type="checkbox" id="selectAllCourses" onclick="toggleAllCourses(this)">
                    </th>
                    <th>번호</th>
                    <th>기간명</th>
                    <th>강좌명</th>
                    <th>강사명</th>
                    <th>강좌기간</th>
                    <th>수강료</th>
                    <th>신청/정원</th>
                    <th>대기/정원</th>
                    <th>신청상태</th>
                </tr>
            </thead>
            <tbody id="courseTableBody">
                <!-- JS에서 채워짐 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 마이페이지 -->
<div id="mypageContainer" class="section hidden">
    <h3>📝 내 수강 내역</h3>
    <ul id="myCourseList"></ul>

    <h3>🗓 내 시간표</h3>
    <div id="calendar"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<!-- Calendar -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.7/main.min.js'></script>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
