<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>교리초 수강신청 - 학생용</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>📚 교리초 수강신청 (학생용)</h2>

    <div class="card" id="userCard" style="max-width:900px;margin:10px auto;">
        <p><strong>학생:</strong> <span id="studentName"></span></p>
        <button onclick="logout()" class="secondary-btn">로그아웃</button>
        <button id="btnMyPage" class="secondary-btn" onclick="openMyPage()">마이페이지</button>
    </div>

    <div class="card" style="max-width:900px;margin:10px auto;">
        <button class="primary-btn" onclick="showCourseList()">강좌 신청</button>
    </div>

    <div class="card" id="courseContainer" style="max-width:1100px;margin:10px auto;display:none;">
        <h3>강좌 신청</h3>
        <p id="applyStatusMsg" style="font-size:14px;color:#444;margin-bottom:10px;"></p>

        <div class="table-wrapper">
            <table class="course-table">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>강좌명</th>
                        <th>요일</th>
                        <th>시간</th>
                        <th>정원</th>
                        <th>신청/대기</th>
                        <th>신청상태</th>
                    </tr>
                </thead>
                <tbody id="courseTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 마이페이지 -->
    <div id="myPage" class="card" style="max-width:1100px;margin:10px auto;display:none;">
        <h3>📘 마이페이지</h3>
        <p id="totalHours" style="font-size:14px;font-weight:bold;color:#2e7d32;margin-bottom:15px;"></p>

        <h4>📚 신청한 과목</h4>
        <ul id="myAppliedList"></ul>

        <h4 style="margin-top:20px;">⏳ 대기 중인 과목</h4>
        <ul id="myWaitList"></ul>

        <h4 style="margin-top:25px;">🗓 월별 시간표</h4>
        <select id="calendarMonth" onchange="loadMonthlySchedule()" style="margin-bottom:10px;">
            <option value="">월 선택</option>
            <option value="1">1월</option>
            <option value="2">2월</option>
            <option value="3">3월</option>
            <option value="4">4월</option>
            <option value="5">5월</option>
            <option value="6">6월</option>
            <option value="7">7월</option>
            <option value="8">8월</option>
            <option value="9">9월</option>
            <option value="10">10월</option>
            <option value="11">11월</option>
            <option value="12">12월</option>
        </select>
        <ul id="monthlySchedule" style="margin-bottom:20px;"></ul>

        <h4 style="margin-top:25px;">📅 주간 시간표</h4>
        <div id="weeklyTable"></div>

        <h4 style="margin-top:25px;">📆 수업 캘린더</h4>
        <div id="calendarView"></div>

        <button onclick="closeMyPage()" class="secondary-btn" style="margin-top:20px;">닫기</button>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
