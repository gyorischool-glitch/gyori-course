<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>학생 로그인 - 교리초 수강신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin:0; padding:0; background:#f5f7fb; }
    .wrap { max-width:480px; margin:40px auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 8px 20px rgba(0,0,0,.06); }
    h2 { margin-top:0; font-size:20px; }
    label { display:block; margin:10px 0 4px; font-size:14px; }
    input { width:100%; padding:10px; border-radius:6px; border:1px solid #d0d7e2; box-sizing:border-box; }
    button { margin-top:16px; width:100%; padding:10px; border-radius:8px; border:none; background:#2563eb; color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .back { margin-top:12px; display:block; text-align:center; text-decoration:none; color:#2563eb; font-size:14px; }
    .msg { margin-top:8px; font-size:13px; color:#ef4444; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>학생 정보 입력</h2>
    <p style="margin:4px 0 16px; color:#555; font-size:14px;">
      수강신청을 위해 학생 학년/반/이름을 입력해 주세요.
    </p>
    <label>학년</label>
    <input id="grade" placeholder="예: 3" />
    <label>반</label>
    <input id="class" placeholder="예: 2 또는 사랑반" />
    <label>학생 이름</label>
    <input id="name" placeholder="예: 홍길동" />
    <button id="nextBtn">수강신청 화면으로</button>
    <div class="msg" id="msg"></div>
    <a href="index.html" class="back">← 메인으로</a>
  </div>

  <script type="module">
    const gradeInput = document.getElementById('grade');
    const classInput = document.getElementById('class');
    const nameInput  = document.getElementById('name');
    const btn        = document.getElementById('nextBtn');
    const msg        = document.getElementById('msg');

    btn.addEventListener('click', () => {
      const grade = gradeInput.value.trim();
      const clazz = classInput.value.trim();
      const name  = nameInput.value.trim();

      if (!grade || !clazz || !name) {
        msg.textContent = '학년, 반, 이름을 모두 입력해 주세요.';
        return;
      }
      const student = { grade, class: clazz, name };
      localStorage.setItem('gyori_student', JSON.stringify(student));
      window.location.href = 'courses.html';
    });
  </script>
</body>
</html>
